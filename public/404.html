<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CAHP Compliance Hub</title>
  <script>
    // SPA fallback for GitHub Pages.
    // GitHub Pages doesn't natively support client-side routing — without this, a refresh
    // on /properties/12 returns 404. This page captures the requested path, redirects
    // to the app root with the path encoded as a query string, then the script in
    // index.html restores the URL before React Router boots.
    //
    // https://github.com/rafgraph/spa-github-pages
    var pathSegmentsToKeep = 1; // keep "/cahp-compliance-hub" — the project pages prefix
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
